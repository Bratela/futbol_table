<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnīrs / Турнир</title>
<style>
  :root { --bg:#0f1a14; --card:#17261d; --line:#25382c; --text:#eaf3ec; --muted:#8fa597; --accent:#3ddc84; --loss:#f0616d; --field:#0f1a14; --warn:#e3b341; color-scheme:dark; }
  :root[data-theme="light"] { --bg:#eef3ef; --card:#ffffff; --line:#d3ddd6; --text:#14221a; --muted:#5b7165; --accent:#0e8a47; --loss:#d33a47; --field:#f3f7f4; --warn:#9a6b00; color-scheme:light; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; }
  header { text-align:center; margin:6px 0 14px; }
  header h1 { font-size:21px; margin:0 0 4px; }
  header p { margin:2px 0; color:var(--muted); font-size:13px; }
  h2 { font-size:13px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px; }
  .topbar { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .topbar .grp-btns { display:flex; gap:6px; }
  button.lang.active { background:var(--accent); color:#0b1a10; border-color:var(--accent); font-weight:700; }

  .groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:14px; margin-bottom:6px; }
  .groups .card { margin:0; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { padding:8px 4px; text-align:center; white-space:nowrap; }
  th { font-size:11px; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line); }
  td { border-bottom:1px solid var(--line); font-size:13px; }
  tr:last-child td { border-bottom:none; }
  td.team, th.team { text-align:left; }
  td.team { font-weight:600; }
  td.pts { font-weight:800; color:var(--accent); font-size:15px; }
  td.pos { color:var(--muted); width:22px; }
  tr.q td.pos { color:var(--accent); font-weight:700; }
  tr.q { background:color-mix(in srgb, var(--accent) 9%, transparent); }
  .pos-gd{color:var(--accent)} .neg-gd{color:var(--loss)}
  .legend { color:var(--muted); font-size:12px; margin:6px 2px 14px; }
  .empty { color:var(--muted); font-size:14px; padding:6px 0; }
  .warn { color:var(--warn); font-size:13px; margin-bottom:8px; }

  .game { padding:10px 0; border-bottom:1px solid var(--line); }
  .game:last-child { border-bottom:none; }
  .meta { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .time { font-weight:700; color:var(--text); }
  .tag { background:var(--field); border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  .tag.po { color:var(--accent); border-color:var(--accent); }
  .teams { display:flex; align-items:center; gap:8px; }
  .tn { flex:1; min-width:0; font-size:14px; font-weight:600; overflow-wrap:anywhere; }
  .tn.r { text-align:right; }
  .tn.tbd { color:var(--muted); font-weight:400; font-style:italic; }
  .tn.win { color:var(--accent); }
  .sc { display:flex; align-items:center; gap:5px; }
  input, select, button { font:inherit; color:var(--text); background:var(--field); border:1px solid var(--line); border-radius:8px; padding:8px 8px; }
  input[type=number].score { width:48px; text-align:center; font-weight:700; font-size:16px; padding:8px 4px; }
  input:disabled { opacity:.35; }
  input[type=text], input[type=time], input[type=number] { min-width:0; }
  .pen { margin-top:6px; display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); }
  .pen select { flex:1; padding:5px; font-size:13px; }
  .note { color:var(--muted); font-size:13px; padding:8px 0 0; }

  button { cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); }
  button.ghost:hover, button.x:hover { color:var(--loss); border-color:var(--loss); }
  button.primary { background:var(--accent); color:#0b1a10; font-weight:700; border:none; }
  button.x { background:transparent; color:var(--muted); padding:8px 10px; }
  button.armed { color:var(--loss); border-color:var(--loss); }

  .places { list-style:none; margin:0; padding:0; }
  .places li { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .places li:last-child { border-bottom:none; }
  .places .n { width:26px; height:26px; border-radius:50%; background:var(--field); border:1px solid var(--line);
               display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--muted); flex:none; }
  .places li.top .n { background:var(--accent); color:#0b1a10; border:none; }
  .places .none { color:var(--muted); font-style:italic; }

  .f { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; flex:1; min-width:130px; }
  .f label { font-size:12px; color:var(--muted); }
  .frow { display:flex; gap:10px; flex-wrap:wrap; }
  .chk { flex-direction:row; align-items:center; gap:8px; }
  .chk input { width:18px; height:18px; }
  .grp { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; }
  .grow, .trow { display:flex; gap:6px; margin-bottom:6px; }
  .grow input, .trow input { flex:1; }
  .grow input { font-weight:700; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  hr { border:none; border-top:1px solid var(--line); margin:12px 0; }

  /* ---------- форма печати ---------- */
  #printView { max-width:820px; margin:0 auto; }
  .pbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .pbar .chk { margin:0; flex:none; min-width:0; }
  .phint { color:var(--muted); font-size:12px; margin-bottom:10px; }
  .sheet { background:#fff; color:#000; border-radius:6px; padding:22px 20px; font-family:"Times New Roman",Times,serif; }
  .sheet h1 { font-size:22px; text-align:center; margin:0 0 4px; }
  .sheet .sub { text-align:center; margin:2px 0; font-size:14px; font-weight:bold; }
  .sheet h3 { font-size:14px; margin:14px 0 4px; }
  .sheet table { border:1.5px solid #000; width:100%; }
  .sheet th, .sheet td { border:1px solid #000; color:#000; padding:5px 6px; font-size:13px; background:none; }
  .sheet th { font-weight:bold; font-size:12px; }
  .sheet td.team { text-align:left; }
  .sheet td.pts { color:#000; font-size:13px; }
  .sheet .sgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:0 16px; }
  .sheet td.t, .sheet td.s { text-align:center; width:64px; }
  .sheet td.g { text-align:left; }
  .sheet td.s { width:90px; font-weight:bold; }
  .sheet .gtag { font-size:11px; font-weight:bold; margin-right:6px; }
  .sheet .foot { margin-top:12px; font-size:13px; }
  .sheet tr, .sheet h3 { break-inside:avoid; }
  .sheet h3 { break-after:avoid; }
  .sheet table.pl td { height:26px; }

  @media print {
    @page { size:A4; margin:12mm; }
    body { background:#fff; padding:0; }
    #app { display:none !important; }
    #printView, #printView[hidden] { display:block !important; max-width:none; }
    .pbar, .phint { display:none !important; }
    .sheet { border-radius:0; padding:0; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="topbar">
    <div class="grp-btns">
      <button class="ghost" id="toggleSettings"></button>
      <button class="ghost" id="openPrint"></button>
      <button class="ghost" id="toggleTheme" title="☀ / 🌙"></button>
    </div>
    <div class="grp-btns">
      <button class="ghost lang" data-lang="ru">RU</button>
      <button class="ghost lang" data-lang="lv">LV</button>
    </div>
  </div>

  <div class="card" id="settings" hidden></div>

  <header id="head"></header>
  <div class="groups" id="tables"></div>
  <div class="legend" id="legend"></div>

  <div class="card">
    <h2 id="hSchedule"></h2>
    <div id="warn" class="warn"></div>
    <div id="games"></div>
    <div class="note" id="note"></div>
  </div>

  <div class="card" id="placesCard">
    <h2 id="hPlaces"></h2>
    <ol class="places" id="places"></ol>
  </div>
</div>

<div id="printView" hidden>
  <div class="pbar">
    <button class="primary" id="doPrint"></button>
    <div class="f chk"><input type="checkbox" id="withRes"><label id="withResL" for="withRes"></label></div>
    <button class="ghost" id="closePrint"></button>
  </div>
  <div class="phint" id="phint"></div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
const KEY = "tournament-universal-v1";

/* ---------- Переводы / Tulkojumi ---------- */
const I18N = {
  ru: {
    settingsBtn: "⚙ Настройки", printBtn: "🖨 Форма печати",
    group: "Группа", schedule: "Расписание и результаты", places: "Итоговые места",
    team: "Команда", cols: ["И", "В", "Н", "П", "М", "РМ", "О"],
    legendQ: n => `Зелёным — выходят в плей-офф (${n}). `,
    legendAbbr: "И — игры, В — победы, Н — ничьи, П — поражения, М — мячи, РМ — разница мячей, О — очки (3/1/0).",
    hintTeams: "Добавьте команды в настройках ⚙", hintGroup: "Добавьте группу в настройках ⚙",
    hintMatches: "Матчей пока нет — добавьте команды в настройках ⚙",
    tie: "Ничья — победитель по пенальти:", choose: "выберите", undecided: "ещё не определено",
    winner: "Победитель", loser: "Проигравший",
    posLabel: (n, g) => `${n} место гр. ${g}`, seedLabel: n => `Сеяный №${n}`,
    rSemi: "Полуфинал", rFinal: "Финал", rQuarter: "Четвертьфинал", rRound: k => `1/${k} финала`,
    third: "За 3 место", third34: "За 3–4 место", placeGame: (a, b) => `За ${a}–${b} место`,
    warnCross: "Режим «крест-накрест» работает при ровно двух группах, в каждой минимум 2 команды.",
    warnMin: "Для плей-офф нужно минимум 2 участника.",
    sTitle: "Настройки турнира", fTitle: "Название", fLine1: "Строка 1 (вид спорта, дата)", fLine2: "Строка 2 (место)",
    fLine3: "Строка 3 (формат игр)", fNote: "Примечание под расписанием",
    fStart: "Начало первого матча", fSlot: "Минут на один матч (с перерывом)", fPlayoff: "Плей-офф",
    oCross: "Крест-накрест (2 группы, как в образце)", oKnock: "Олимпийская сетка (любое число групп)", oNone: "Без плей-офф (только группы)",
    fQual: "Сколько команд из каждой группы выходит дальше", fThird: "Матч за 3 место",
    sGroups: "Группы и команды", phGroup: "Название группы", phTeam: "Новая команда",
    delGroup: "Удалить группу", delTeam: "Удалить команду", addGroup: "＋ Группа",
    clear: "Очистить результаты", sampleBtn: "Загрузить пример", blankBtn: "Новый пустой турнир",
    sNote: "Расписание строится автоматически: матчи «каждый с каждым» в группах, затем плей-офф. Все изменения сохраняются в этом браузере.",
    again: "Нажмите ещё раз для подтверждения", teamDefault: n => `Команда ${n}`,
    pPrint: "🖨 Печать", pRes: "С результатами", pBack: "← Назад",
    pHint: "Если печать не открылась в приложении, откройте страницу в браузере и нажмите «Печать» (Ctrl+P) — распечатается именно эта форма.",
    pTeams: "Команды", pGame: "Матч", pTime: "Время", pScore: "Счёт",
    sampleLine3: "Формат 5×5, 1×15 мин.", sampleNote: "Между играми в малом зале — спортивные тесты. Награждение — 12:00.",
    blankTitle: "Название турнира", blankL1: "Дата", blankL2: "Место проведения",
  },
  lv: {
    settingsBtn: "⚙ Iestatījumi", printBtn: "🖨 Drukas forma",
    group: "Grupa", schedule: "Grafiks un rezultāti", places: "Gala vietas",
    team: "Komanda", cols: ["S", "U", "N", "Z", "V", "VS", "P"],
    legendQ: n => `Zaļie — iekļūst izslēgšanas spēlēs (${n}). `,
    legendAbbr: "S — spēles, U — uzvaras, N — neizšķirti, Z — zaudējumi, V — vārti, VS — vārtu starpība, P — punkti (3/1/0).",
    hintTeams: "Pievienojiet komandas iestatījumos ⚙", hintGroup: "Pievienojiet grupu iestatījumos ⚙",
    hintMatches: "Spēļu vēl nav — pievienojiet komandas iestatījumos ⚙",
    tie: "Neizšķirts — uzvarētājs pēc soda sitieniem:", choose: "izvēlieties", undecided: "vēl nav noteikts",
    winner: "Uzvarētājs", loser: "Zaudētājs",
    posLabel: (n, g) => `${n}. vieta Gr. ${g}`, seedLabel: n => `Sēklinieks Nr. ${n}`,
    rSemi: "Pusfināls", rFinal: "Fināls", rQuarter: "Ceturtdaļfināls", rRound: k => `1/${k} fināls`,
    third: "Spēle par 3. vietu", third34: "Spēle par 3.–4. vietu", placeGame: (a, b) => `Spēle par ${a}.–${b}. vietu`,
    warnCross: "Krusta sistēma darbojas tikai ar divām grupām, katrā vismaz 2 komandas.",
    warnMin: "Izslēgšanas spēlēm vajag vismaz 2 dalībniekus.",
    sTitle: "Turnīra iestatījumi", fTitle: "Nosaukums", fLine1: "1. rinda (sporta veids, datums)", fLine2: "2. rinda (norises vieta)",
    fLine3: "3. rinda (spēļu formāts)", fNote: "Piezīme zem grafika",
    fStart: "Pirmās spēles sākums", fSlot: "Minūtes uz vienu spēli (ar pārtraukumu)", fPlayoff: "Izslēgšanas spēles",
    oCross: "Krusta sistēma (2 grupas, kā paraugā)", oKnock: "Olimpiskā sistēma (jebkurš grupu skaits)", oNone: "Bez izslēgšanas spēlēm (tikai grupas)",
    fQual: "Cik komandas no katras grupas iekļūst tālāk", fThird: "Spēle par 3. vietu",
    sGroups: "Grupas un komandas", phGroup: "Grupas nosaukums", phTeam: "Jauna komanda",
    delGroup: "Dzēst grupu", delTeam: "Dzēst komandu", addGroup: "＋ Grupa",
    clear: "Notīrīt rezultātus", sampleBtn: "Ielādēt paraugu", blankBtn: "Jauns tukšs turnīrs",
    sNote: "Grafiks tiek veidots automātiski: spēles «katrs ar katru» grupās, pēc tam izslēgšanas spēles. Izmaiņas tiek saglabātas šajā pārlūkā.",
    again: "Nospiediet vēlreiz, lai apstiprinātu", teamDefault: n => `Komanda ${n}`,
    pPrint: "🖨 Drukāt", pRes: "Ar rezultātiem", pBack: "← Atpakaļ",
    pHint: "Ja drukāšana neatveras lietotnē, atveriet lapu pārlūkā un izvēlieties «Drukāt» (Ctrl+P) — tiks izdrukāta tieši šī forma.",
    pTeams: "Komandas", pGame: "Spēle", pTime: "Laiks", pScore: "Rezultāts",
    sampleLine3: "Formāts 5×5, 1×15 min.", sampleNote: "Starp spēlēm mazajā sporta zālē — sporta testi. Apbalvošana — 12:00.",
    blankTitle: "Turnīra nosaukums", blankL1: "Datums", blankL2: "Norises vieta",
  },
};
const t = (k, ...a) => { const v = I18N[state.lang || "ru"][k]; return typeof v === "function" ? v(...a) : v; };

/* ---------- Данные ---------- */
function sample(lang) {
  const L = I18N[lang || "ru"];
  return {
    lang: lang || "ru", nextId: 7,
    info: { title: "Jūrnieks Ziemas Kauss 2026", line1: "Futsal · 21.11.2026",
            line2: "Vecmīlgrāvis, Vecmīlgrāvja vidusskola (Skuju iela 11)", line3: L.sampleLine3, note: L.sampleNote },
    start: "09:15", slot: 15, playoff: "cross", qual: 2, third: true,
    groups: [
      { id: "g1", name: "A", teams: [{ id: "t1", name: "SC Laimite" }, { id: "t2", name: "FS Zolitūde" }, { id: "t3", name: "Vangaži" }] },
      { id: "g2", name: "B", teams: [{ id: "t4", name: "FK Jūrnieks" }, { id: "t5", name: "FS Rīga" }, { id: "t6", name: "Krimulda" }] },
    ],
    scores: {
      "g1:t1:t2": { a: 1, b: 2 }, "g1:t1:t3": { a: 1, b: 3 }, "g1:t2:t3": { a: 4, b: 3 },
      "g2:t4:t5": { a: 0, b: 4 }, "g2:t4:t6": { a: 2, b: 0 }, "g2:t5:t6": { a: 7, b: 1 },
    },
  };
}
function blank(lang) {
  const L = I18N[lang || "ru"];
  return {
    lang: lang || "ru", nextId: 3,
    info: { title: L.blankTitle, line1: L.blankL1, line2: L.blankL2, line3: "", note: "" },
    start: "10:00", slot: 15, playoff: "cross", qual: 2, third: true,
    groups: [{ id: "g1", name: "A", teams: [] }, { id: "g2", name: "B", teams: [] }],
    scores: {},
  };
}
let state = load();
state.lang = state.lang || "ru";
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return sample("ru");
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const uid = p => p + (state.nextId++);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const has = s => s && Number.isInteger(s.a) && Number.isInteger(s.b);

/* ---------- Логика турнира ---------- */
function pairs(teams) {
  const n = teams.length, out = [];
  if (n < 4) {
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) out.push([teams[i], teams[j]]);
    return out;
  }
  const arr = teams.slice(); if (n % 2) arr.push(null);
  const m = arr.length;
  for (let r = 0; r < m - 1; r++) {
    for (let i = 0; i < m / 2; i++) {
      const a = arr[i], b = arr[m - 1 - i];
      if (a && b) out.push(r % 2 ? [b, a] : [a, b]);
    }
    arr.splice(1, 0, arr.pop());
  }
  return out;
}
function seedOrder(n) {
  let arr = [1, 2];
  while (arr.length < n) { const len = arr.length; arr = arr.flatMap(x => [x, 2 * len + 1 - x]); }
  return arr.slice(0, n);
}
function roundName(r, total) {
  const left = total - r;
  return left === 1 ? t("rFinal") : left === 2 ? t("rSemi") : left === 3 ? t("rQuarter") : t("rRound", 2 ** (left - 1));
}
function timeAt(i) {
  const [h, m] = (state.start || "00:00").split(":").map(Number);
  const x = ((h || 0) * 60 + (m || 0) + i * (state.slot || 15)) % 1440;
  return String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0");
}

function playoffDefs() {
  const G = state.groups, matches = [], places = [];
  if (state.playoff === "cross") {
    if (G.length !== 2 || G.some(g => g.teams.length < 2)) return { matches, places, warn: t("warnCross") };
    matches.push(
      { id: "sf1", tag: t("rSemi") + " 1", h: { pos: [0, 1] }, a: { pos: [1, 2] } },
      { id: "sf2", tag: t("rSemi") + " 2", h: { pos: [1, 1] }, a: { pos: [0, 2] } });
    const maxN = Math.min(G[0].teams.length, G[1].teams.length);
    for (let n = maxN; n >= 3; n--) {
      matches.push({ id: "p" + n, tag: t("placeGame", 2 * n - 1, 2 * n), h: { pos: [0, n] }, a: { pos: [1, n] } });
      places.push({ id: "p" + n, w: 2 * n - 1, l: 2 * n });
    }
    matches.push(
      { id: "p34", tag: t("third34"), h: { from: "sf1", r: "L" }, a: { from: "sf2", r: "L" } },
      { id: "fin", tag: t("rFinal"), h: { from: "sf1", r: "W" }, a: { from: "sf2", r: "W" } });
    places.push({ id: "fin", w: 1, l: 2 }, { id: "p34", w: 3, l: 4 });
  } else if (state.playoff === "knockout") {
    const N = G.reduce((s, g) => s + Math.min(state.qual, g.teams.length), 0);
    if (N < 2) return { matches, places, warn: t("warnMin") };
    let size = 2; while (size * 2 <= N) size *= 2;
    const order = seedOrder(size), rounds = Math.log2(size);
    let cur = [];
    for (let i = 0; i < size; i += 2) cur.push([{ seed: order[i] }, { seed: order[i + 1] }]);
    for (let r = 0; r < rounds; r++) {
      const rm = cur.map((p, i) => ({ id: `k${r}-${i}`, h: p[0], a: p[1], tag: roundName(r, rounds) + (cur.length > 1 ? ` ${i + 1}` : "") }));
      if (r === rounds - 1 && state.third && rounds >= 2) {
        matches.push({ id: "k3", tag: t("third"), h: { from: `k${r - 1}-0`, r: "L" }, a: { from: `k${r - 1}-1`, r: "L" } });
        places.push({ id: "k3", w: 3, l: 4 });
      }
      matches.push(...rm);
      const next = [];
      for (let i = 0; i + 1 < cur.length; i += 2) next.push([{ from: `k${r}-${i}`, r: "W" }, { from: `k${r}-${i + 1}`, r: "W" }]);
      cur = next;
    }
    places.unshift({ id: `k${rounds - 1}-0`, w: 1, l: 2 });
  }
  return { matches, places, warn: "" };
}

function buildSchedule() {
  const list = [];
  state.groups.forEach(g => pairs(g.teams).forEach(([a, b]) =>
    list.push({ id: `${g.id}:${a.id}:${b.id}`, g, h: { team: a.id }, a: { team: b.id } })));
  const po = playoffDefs();
  list.push(...po.matches);
  list.forEach((m, i) => m.t = timeAt(i));
  return { list, places: po.places, warn: po.warn };
}

function cmp(x, y) { return y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || x.name.localeCompare(y.name); }
function groupTable(g) {
  const tb = {};
  g.teams.forEach(x => tb[x.id] = { id: x.id, name: x.name, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 });
  pairs(g.teams).forEach(([a, b]) => {
    const s = state.scores[`${g.id}:${a.id}:${b.id}`];
    if (!has(s)) return;
    const H = tb[a.id], A = tb[b.id];
    H.p++; A.p++; H.gf += s.a; H.ga += s.b; A.gf += s.b; A.ga += s.a;
    if (s.a > s.b) { H.w++; A.l++; H.pts += 3; }
    else if (s.a < s.b) { A.w++; H.l++; A.pts += 3; }
    else { H.d++; A.d++; H.pts++; A.pts++; }
  });
  return Object.values(tb).sort(cmp);
}
const groupDone = g => pairs(g.teams).every(([a, b]) => has(state.scores[`${g.id}:${a.id}:${b.id}`]));
const teamName = id => { for (const g of state.groups) { const x = g.teams.find(y => y.id === id); if (x) return x.name; } return "?"; };
function winnerSide(s) {
  if (s.a > s.b) return 0;
  if (s.b > s.a) return 1;
  return s.pen === 0 || s.pen === 1 ? s.pen : null;
}

// Подпись места в сетке (до того как команда известна)
function refLabel(ref, sched) {
  if (ref.team) return teamName(ref.team);
  if (ref.pos) return t("posLabel", ref.pos[1], state.groups[ref.pos[0]].name);
  if (ref.seed) return t("seedLabel", ref.seed);
  const tag = sched.list.find(m => m.id === ref.from).tag;
  return `${ref.r === "W" ? t("winner") : t("loser")}: ${tag}`;
}

function resolve() {
  const G = state.groups, tables = {}, done = {};
  G.forEach(g => { tables[g.id] = groupTable(g); done[g.id] = groupDone(g); });
  const allDone = G.every(g => done[g.id]);
  const sched = buildSchedule();

  let seeds = [];
  if (state.playoff === "knockout" && allDone) {
    const arr = [];
    G.forEach(g => tables[g.id].slice(0, state.qual).forEach((row, i) => arr.push({ ...row, pos: i })));
    arr.sort((x, y) => x.pos - y.pos || cmp(x, y));
    let size = 2; while (size * 2 <= arr.length) size *= 2;
    seeds = arr.slice(0, size);
  }
  const res = {};
  const slot = ref => {
    if (ref.team) return { name: teamName(ref.team), real: true };
    if (ref.pos) {
      const g = G[ref.pos[0]], row = tables[g.id][ref.pos[1] - 1];
      if (done[g.id] && row) return { name: row.name, real: true };
    } else if (ref.seed) {
      if (seeds[ref.seed - 1]) return { name: seeds[ref.seed - 1].name, real: true };
    } else {
      const src = res[ref.from];
      if (src && src.winner != null) return { name: [src.h.name, src.a.name][ref.r === "W" ? src.winner : 1 - src.winner], real: true };
    }
    return { name: refLabel(ref, sched), real: false };
  };
  sched.list.forEach(m => {
    const h = slot(m.h), a = slot(m.a), s = state.scores[m.id] || {};
    res[m.id] = { m, h, a, s, winner: h.real && a.real && has(s) ? winnerSide(s) : null };
  });
  return { tables, sched, res };
}

/* ---------- Отображение ---------- */
function renderChrome() {
  document.documentElement.lang = state.lang;
  const light = (state.theme || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")) === "light";
  document.documentElement.dataset.theme = light ? "light" : "dark";
  $("toggleTheme").textContent = light ? "🌙" : "☀️";
  $("toggleSettings").textContent = t("settingsBtn");
  $("openPrint").textContent = t("printBtn");
  document.querySelectorAll("button.lang").forEach(b => b.classList.toggle("active", b.dataset.lang === state.lang));
  $("hSchedule").textContent = t("schedule");
  $("hPlaces").textContent = t("places");
  $("doPrint").textContent = t("pPrint");
  $("withResL").textContent = t("pRes");
  $("closePrint").textContent = t("pBack");
  $("phint").textContent = t("pHint");
}

function renderMain() {
  const { tables, sched, res } = resolve();
  const I = state.info;
  document.title = I.title || "Turnīrs";

  $("head").innerHTML = `<h1>⚽ ${esc(I.title)}</h1>` + [I.line1, I.line2, I.line3].filter(Boolean).map(l => `<p>${esc(l)}</p>`).join("");

  const qn = state.playoff === "cross" ? 2 : state.playoff === "knockout" ? state.qual : 0;
  const cols = t("cols");
  $("tables").innerHTML = state.groups.length ? state.groups.map(g => `
    <div class="card"><h2>${t("group")} ${esc(g.name)}</h2>
    ${g.teams.length ? `<div class="scroll"><table>
      <thead><tr><th>#</th><th class="team">${t("team")}</th>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${tables[g.id].map((r, i) => {
        const gd = r.gf - r.ga;
        return `<tr class="${i < qn ? "q" : ""}"><td class="pos">${i + 1}</td><td class="team">${esc(r.name)}</td>
          <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}-${r.ga}</td>
          <td class="${gd > 0 ? "pos-gd" : gd < 0 ? "neg-gd" : ""}">${gd > 0 ? "+" : ""}${gd}</td><td class="pts">${r.pts}</td></tr>`;
      }).join("")}</tbody></table></div>` : `<div class="empty">${t("hintTeams")}</div>`}
    </div>`).join("") : `<div class="card empty">${t("hintGroup")}</div>`;

  $("legend").textContent = (qn ? t("legendQ", qn) : "") + t("legendAbbr");
  $("warn").textContent = sched.warn;

  $("games").innerHTML = sched.list.length ? sched.list.map(m => {
    const r = res[m.id], ready = r.h.real && r.a.real, s = r.s;
    const tie = !m.g && ready && has(s) && s.a === s.b;
    const inp = side => `<input class="score" type="number" min="0" max="99" inputmode="numeric" data-id="${esc(m.id)}" data-side="${side}"
        value="${s[side] == null ? "" : s[side]}" ${ready ? "" : "disabled"}>`;
    return `<div class="game">
      <div class="meta"><span class="time">${m.t}</span>
        <span class="tag ${m.g ? "" : "po"}">${m.g ? t("group") + " " + esc(m.g.name) : esc(m.tag)}</span></div>
      <div class="teams">
        <span class="tn r ${r.h.real ? "" : "tbd"} ${r.winner === 0 ? "win" : ""}">${esc(r.h.name)}</span>
        <div class="sc">${inp("a")}<span>:</span>${inp("b")}</div>
        <span class="tn ${r.a.real ? "" : "tbd"} ${r.winner === 1 ? "win" : ""}">${esc(r.a.name)}</span>
      </div>
      ${tie ? `<div class="pen">${t("tie")}
        <select data-id="${esc(m.id)}" data-side="pen">
          <option value="">${t("choose")}</option>
          <option value="0" ${s.pen === 0 ? "selected" : ""}>${esc(r.h.name)}</option>
          <option value="1" ${s.pen === 1 ? "selected" : ""}>${esc(r.a.name)}</option>
        </select></div>` : ""}
    </div>`;
  }).join("") : `<div class="empty">${t("hintMatches")}</div>`;

  $("note").textContent = I.note || "";

  const slots = [];
  sched.places.forEach(p => { slots.push({ n: p.w, id: p.id, w: true }); slots.push({ n: p.l, id: p.id, w: false }); });
  slots.sort((a, b) => a.n - b.n);
  $("placesCard").hidden = !slots.length;
  $("places").innerHTML = slots.map(s => {
    const r = res[s.id];
    const name = r && r.winner != null ? [r.h.name, r.a.name][s.w ? r.winner : 1 - r.winner] : null;
    return `<li class="${s.n === 1 && name ? "top" : ""}"><span class="n">${s.n}</span>${name ? (s.n === 1 ? "🏆 " : "") + esc(name) : `<span class="none">${t("undecided")}</span>`}</li>`;
  }).join("");

  renderPrint();
}

function renderPrint() {
  const withRes = $("withRes").checked;
  const { tables, sched, res } = resolve();
  const I = state.info, cols = t("cols");
  const side = (m, k) => withRes ? res[m.id][k].name : refLabel(m[k], sched);

  const groupsHtml = state.groups.map(g => {
    const rows = withRes ? tables[g.id] : g.teams.map(x => ({ id: x.id, name: x.name, blank: true }));
    return `<div><h3>${t("group")} ${esc(g.name)}</h3><table>
      <thead><tr><th>#</th><th class="team">${t("team")}</th>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((r, i) => r.blank
        ? `<tr><td>${i + 1}</td><td class="team">${esc(r.name)}</td>${cols.map(() => "<td>&nbsp;</td>").join("")}</tr>`
        : `<tr><td>${i + 1}</td><td class="team">${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
           <td>${r.gf}-${r.ga}</td><td>${r.gf - r.ga > 0 ? "+" : ""}${r.gf - r.ga}</td><td><b>${r.pts}</b></td></tr>`).join("")}
      </tbody></table></div>`;
  }).join("");

  const gamesHtml = sched.list.map(m => {
    const s = state.scores[m.id], shown = withRes && has(s);
    let score = shown ? `${s.a} : ${s.b}` : "&nbsp;";
    if (shown && !m.g && s.a === s.b && (s.pen === 0 || s.pen === 1)) score += ` (${esc([res[m.id].h.name, res[m.id].a.name][s.pen])})`;
    return `<tr><td class="t">${m.t}</td>
      <td class="g"><span class="gtag">${m.g ? esc(t("group") + " " + m.g.name) : esc(m.tag)}</span>${esc(side(m, "h"))} – ${esc(side(m, "a"))}</td>
      <td class="s">${score}</td></tr>`;
  }).join("");

  const slots = [];
  sched.places.forEach(p => { slots.push({ n: p.w, id: p.id, w: true }); slots.push({ n: p.l, id: p.id, w: false }); });
  slots.sort((a, b) => a.n - b.n);
  const placesHtml = slots.length ? `<h3>${t("places")}</h3><table class="pl"><thead><tr><th>#</th><th class="team">${t("team")}</th></tr></thead><tbody>${
    slots.map(x => {
      const r = res[x.id];
      const nm = withRes && r && r.winner != null ? [r.h.name, r.a.name][x.w ? r.winner : 1 - r.winner] : "&nbsp;";
      return `<tr><td class="t">${x.n}</td><td class="team">${withRes && nm !== "&nbsp;" ? esc(nm) : nm}</td></tr>`;
    }).join("")}</tbody></table>` : "";

  $("sheet").innerHTML = `
    <h1>${esc(I.title)}</h1>
    ${[I.line1, I.line2, I.line3].filter(Boolean).map(l => `<p class="sub">${esc(l)}</p>`).join("")}
    <div class="sgrid">${groupsHtml}</div>
    <h3>${t("pGame")}</h3>
    <table><thead><tr><th>${t("pTime")}</th><th>${t("pGame")}</th><th>${t("pScore")}</th></tr></thead><tbody>${gamesHtml}</tbody></table>
    ${placesHtml}
    ${I.note ? `<div class="foot">${esc(I.note)}</div>` : ""}`;
}

function renderSettings() {
  const I = state.info;
  const tf = (label, f, v) => `<div class="f"><label>${label}</label><input type="text" data-f="${f}" value="${esc(v)}"></div>`;
  $("settings").innerHTML = `
    <h2>${t("sTitle")}</h2>
    ${tf(t("fTitle"), "title", I.title)}${tf(t("fLine1"), "line1", I.line1)}${tf(t("fLine2"), "line2", I.line2)}
    ${tf(t("fLine3"), "line3", I.line3)}${tf(t("fNote"), "note", I.note)}
    <div class="frow">
      <div class="f"><label>${t("fStart")}</label><input type="time" data-f="start" value="${esc(state.start)}"></div>
      <div class="f"><label>${t("fSlot")}</label><input type="number" min="1" max="240" data-f="slot" value="${state.slot}"></div>
    </div>
    <div class="f"><label>${t("fPlayoff")}</label>
      <select data-f="playoff">
        <option value="cross" ${state.playoff === "cross" ? "selected" : ""}>${t("oCross")}</option>
        <option value="knockout" ${state.playoff === "knockout" ? "selected" : ""}>${t("oKnock")}</option>
        <option value="none" ${state.playoff === "none" ? "selected" : ""}>${t("oNone")}</option>
      </select></div>
    ${state.playoff === "knockout" ? `
      <div class="frow">
        <div class="f"><label>${t("fQual")}</label><input type="number" min="1" max="16" data-f="qual" value="${state.qual}"></div>
        <div class="f chk"><input type="checkbox" data-f="third" id="third" ${state.third ? "checked" : ""}><label for="third">${t("fThird")}</label></div>
      </div>` : ""}
    <hr>
    <h2>${t("sGroups")}</h2>
    ${state.groups.map(g => `
      <div class="grp">
        <div class="grow"><input type="text" data-gname="${g.id}" value="${esc(g.name)}" placeholder="${t("phGroup")}">
          <button class="x" data-act="delg" data-id="${g.id}" title="${t("delGroup")}">✕</button></div>
        ${g.teams.map(x => `<div class="trow"><input type="text" data-tname="${x.id}" value="${esc(x.name)}">
          <button class="x" data-act="delt" data-id="${x.id}" title="${t("delTeam")}">✕</button></div>`).join("")}
        <div class="trow"><input type="text" data-newteam="${g.id}" placeholder="${t("phTeam")}">
          <button class="primary" data-act="addt" data-id="${g.id}">＋</button></div>
      </div>`).join("")}
    <div class="btns"><button class="primary" data-act="addg">${t("addGroup")}</button></div>
    <hr>
    <div class="btns">
      <button class="ghost" data-act="clear">${t("clear")}</button>
      <button class="ghost" data-act="sample">${t("sampleBtn")}</button>
      <button class="ghost" data-act="blank">${t("blankBtn")}</button>
    </div>
    <div class="legend">${t("sNote")}</div>`;
}
function renderAll() { renderChrome(); renderSettings(); renderMain(); }

/* ---------- События ---------- */
$("toggleSettings").onclick = () => { $("settings").hidden = !$("settings").hidden; };
$("toggleTheme").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  state.theme = cur === "light" ? "dark" : "light"; save(); renderChrome();
};
$("openPrint").onclick = () => { $("app").hidden = true; $("printView").hidden = false; renderPrint(); window.scrollTo(0, 0); };
$("closePrint").onclick = () => { $("printView").hidden = true; $("app").hidden = false; };
$("withRes").onchange = renderPrint;
$("doPrint").onclick = () => { try { window.print(); } catch (e) {} };
document.querySelectorAll("button.lang").forEach(b => b.onclick = () => { state.lang = b.dataset.lang; save(); renderAll(); });

$("games").addEventListener("change", e => {
  const el = e.target, id = el.dataset.id, side = el.dataset.side;
  if (!id) return;
  const s = state.scores[id] = state.scores[id] || {};
  if (side === "pen") s.pen = el.value === "" ? null : +el.value;
  else {
    const n = parseInt(el.value, 10);
    s[side] = isNaN(n) || n < 0 ? null : n;
    if (s.a !== s.b) s.pen = null;
  }
  save(); renderMain();
});

$("settings").addEventListener("input", e => {
  const el = e.target, d = el.dataset;
  if (d.f === "playoff" || d.f === "third") return;
  if (d.f) {
    if (["title", "line1", "line2", "line3", "note"].includes(d.f)) state.info[d.f] = el.value;
    else if (d.f === "start") state.start = el.value || "00:00";
    else if (d.f === "slot") { const n = parseInt(el.value, 10); if (n >= 1) state.slot = n; else return; }
    else if (d.f === "qual") { const n = parseInt(el.value, 10); if (n >= 1) state.qual = n; else return; }
  } else if (d.gname) state.groups.find(g => g.id === d.gname).name = el.value;
  else if (d.tname) state.groups.flatMap(g => g.teams).find(x => x.id === d.tname).name = el.value;
  else return;
  save(); renderMain();
});
$("settings").addEventListener("change", e => {
  const el = e.target, f = el.dataset.f;
  if (f === "playoff") state.playoff = el.value;
  else if (f === "third") state.third = el.checked;
  else return;
  save(); renderAll();
});
$("settings").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset.newteam) {
    const btn = $("settings").querySelector(`[data-act="addt"][data-id="${e.target.dataset.newteam}"]`);
    if (btn) btn.click();
  }
});

function dropScores(test) { Object.keys(state.scores).forEach(k => { if (test(k.split(":"))) delete state.scores[k]; }); }

// подтверждение двойным нажатием (стандартные диалоги в этой среде не работают)
let armed = null, armTimer = null;
$("settings").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (["delg", "clear", "sample", "blank"].includes(act)) {
    const key = act + ":" + id;
    if (armed !== key) {
      armed = key; const orig = b.textContent;
      b.textContent = t("again"); b.classList.add("armed");
      clearTimeout(armTimer);
      armTimer = setTimeout(() => { armed = null; b.textContent = orig; b.classList.remove("armed"); }, 4000);
      return;
    }
    armed = null; clearTimeout(armTimer);
  }
  if (act === "addt") {
    const inp = $("settings").querySelector(`[data-newteam="${id}"]`);
    const g = state.groups.find(x => x.id === id);
    g.teams.push({ id: uid("t"), name: inp.value.trim() || t("teamDefault", g.teams.length + 1) });
  } else if (act === "delt") {
    state.groups.forEach(g => g.teams = g.teams.filter(x => x.id !== id));
    dropScores(p => p[1] === id || p[2] === id);
  } else if (act === "addg") {
    const n = state.groups.length;
    state.groups.push({ id: uid("g"), name: n < 26 ? String.fromCharCode(65 + n) : String(n + 1), teams: [] });
  } else if (act === "delg") {
    state.groups = state.groups.filter(g => g.id !== id);
    dropScores(p => p[0] === id);
  } else if (act === "clear") state.scores = {};
  else if (act === "sample") { const th = state.theme; state = sample(state.lang); state.theme = th; }
  else if (act === "blank") { const th = state.theme; state = blank(state.lang); state.theme = th; }
  save(); renderAll();
});

renderAll();
</script>
